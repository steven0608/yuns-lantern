name: iOS build (iPhone + iPad)
# iOS can't be built on Windows, so GitHub's Mac does it.
#
# Without Apple secrets: an unsigned build that proves the app compiles.
# With them: Xcode's automatic signing via an App Store Connect API key (no
# certificate or profile files to export), then straight to TestFlight.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_P8     contents of the AuthKey_XXXXXXXXXX.p8 file (Admin role key)
#   APPSTORE_API_KEY_ID     the key's ID (10 characters)
#   APPSTORE_API_ISSUER_ID  the Issuer ID shown above the keys list (a UUID)
#   APPLE_TEAM_ID           your Team ID (10 characters, Membership details)
# See docs/TESTFLIGHT.md.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      # `secrets` can't be read in step conditions; expose presence as a flag.
      HAS_SIGNING: ${{ secrets.APPSTORE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get

      - name: Unsigned build (no Apple secrets yet)
        if: env.HAS_SIGNING != 'true'
        run: flutter build ios --release --no-codesign --dart-define=YL_ALL_FREE=true

      - name: Signed build → TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")

          # Test builds unlock everything (YL_ALL_FREE); every upload needs a new build number.
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=YL_ALL_FREE=true

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          # destination=upload: Xcode signs and uploads to App Store Connect → TestFlight.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
