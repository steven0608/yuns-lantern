name: iOS build (iPhone + iPad)
# Builds on macOS (iOS can't be built on Windows). Without signing secrets it
# produces an unsigned build to prove the app compiles. With the secrets below
# it signs and uploads to TestFlight, so the app installs on real devices.
#
# Secrets (Settings → Secrets → Actions), all optional until you're ready:
#   IOS_P12_BASE64, IOS_P12_PASSWORD      distribution certificate
#   IOS_PROFILE_BASE64                    App Store provisioning profile
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8_BASE64
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      # `secrets` can't be read in step conditions; expose presence as a flag.
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Unsigned build
        if: env.HAS_SIGNING != 'true'
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING != 'true'
        with: { name: ios-unsigned, path: Runner-unsigned.zip }
      - name: Signed build → TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          flutter build ipa --release --export-method app-store
          mkdir -p ~/private_keys && echo "$KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
