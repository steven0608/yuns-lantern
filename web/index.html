<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yun's Lantern · 小云的灯笼 — a bilingual English/中文 learning adventure for ages 3–5. No ads, no tracking.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yun's Lantern">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yun's Lantern · 小云的灯笼</title>
  <meta name="theme-color" content="#C8643B">
  <style>
    html, body { margin: 0; height: 100%; background: #FBF1E1; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot span { font-size: 72px; animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-14px); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot"><span>🏮</span></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
